name: CodeQL

# Static analysis for the renderer, the Electron main process and the build
# scripts. Advisory only — it is deliberately not a required status check, so a
# new query landing upstream cannot block an unrelated pull request. Findings
# show up under the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the code is re-scanned as CodeQL's query pack grows even when
    # nothing here changes.
    - cron: "37 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No compiled language here, so the default autobuild is unnecessary —
      # CodeQL extracts the TypeScript sources directly.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
