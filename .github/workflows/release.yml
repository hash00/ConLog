name: Release

# Builds the macOS app on a GitHub runner when a version tag is pushed, then
# attaches it to the release together with a signed build-provenance
# attestation. Anyone can then verify that a downloaded .dmg really was built
# from this repository at that commit:
#
#   gh attestation verify ConLog-1.0.0-arm64.dmg --repo hash00/ConLog
#
# That check is the reason the release build lives here rather than on a
# maintainer's laptop — a locally built artifact cannot be attested.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the release and upload assets
  id-token: write        # request the OIDC token that signs the attestation
  attestations: write    # record the attestation

jobs:
  release:
    # macos-14 and later are Apple Silicon, which is what we ship.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Same gates as CI: never publish something that wouldn't have passed.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build the app
        # --publish never: electron-builder otherwise tries to publish to
        # GitHub by itself when it sees a tag (deprecated, removed in v27).
        # The upload is handled explicitly at the end of this job.
        run: npm run build -- --publish never
        env:
          # No Developer ID is available on the runner. Stop electron-builder
          # from hunting for one; build/afterPack.cjs ad-hoc signs instead.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify the bundle is properly signed
        run: |
          codesign --verify --deep --strict --verbose=2 \
            release/mac-arm64/ConLog.app

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.dmg
            release/*-mac.zip

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release/*.dmg release/*-mac.zip \
            --clobber
